<!doctype html>
<!-- lang, title и description — значения по умолчанию (английский); после загрузки их выставляет LangProvider -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f0e8dd" />
    <!-- Сайт закрыт от поисковиков, пока на нём заглушки. Перед запуском убрать этот тег
         и блок X-Robots-Tag в vercel.json -->
    <meta name="robots" content="noindex, nofollow" />
    <meta
      name="description"
      content="Willow We Love is a coffee shop and bistro in Belgrade: specialty coffee, signature drinks, tartines, focaccia and homemade desserts."
    />
    <title>Willow We Love — coffee shop &amp; bistro in Belgrade</title>
    <!-- Шрифты лежат в проекте (src/fonts.css). Латинские части нужны на любом языке сайта —
         грузим их заранее, чтобы стартовая анимация не ждала; кириллица подгружается по необходимости -->
    <link rel="preload" as="font" type="font/woff2" href="/src/assets/fonts/onest-latin.woff2" crossorigin />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/src/assets/fonts/noto-serif-display-latin.woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
